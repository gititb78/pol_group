<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קבוצת משלחת | רישום נוכחות</title>
    
    <!-- טעינת הספרייה שמאפשרת הורדה ישירה של PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* ================= עיצוב בהיר ונקי לאפליקציית נוכחות ================= */
        * { box-sizing: border-box; }
        
        body {
            background-color: #f4f6f9; color: #333; 
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px 10px; margin: 0; line-height: 1.6;
        }
        
        /* מונה נוכחות צף למעלה משמאל */
        .floating-counter {
            position: fixed; top: 15px; left: 15px;
            background-color: #0d6efd; color: #fff;
            padding: 6px 14px; border-radius: 20px;
            font-weight: bold; font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 9999; border: 2px solid #fff;
        }

        .container {
            max-width: 800px; margin: 0 auto; background-color: #ffffff; 
            padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-top: 10px;
        }
        
        h1 {
            text-align: center; color: #2c3e50; border-bottom: 2px solid #e9ecef; 
            padding-bottom: 15px; margin-top: 0; font-size: 24px;
        }
        
        /* כותרת מיוחדת לתאריך ב-PDF */
        #print-date {
            display: none; text-align: center; color: #0d6efd; font-size: 20px;
            margin-top: -5px; margin-bottom: 20px; font-weight: bold;
        }

        .control-panel {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 15px; background-color: #f8f9fa;
            padding: 15px; border-radius: 8px; border: 1px solid #e9ecef;
        }
        .date-picker-container { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .date-picker {
            border: 1px solid #ced4da; padding: 8px 12px; font-family: inherit; 
            font-size: 16px; border-radius: 5px; color: #495057;
        }
        .print-button {
            background-color: #0d6efd; color: #ffffff; border: none; padding: 10px 20px; 
            font-weight: bold; font-size: 15px; border-radius: 5px; cursor: pointer; 
            transition: background-color 0.2s;
        }
        .print-button:hover { background-color: #0b5ed7; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #dee2e6; padding: 12px; text-align: right; }
        th { background-color: #e9ecef; color: #495057; font-weight: bold; }
        tr:nth-child(even) { background-color: #fdfdfd; }
        
        .note-input {
            width: 100%; background: transparent; border: none; border-bottom: 1px dashed #adb5bd;
            color: #333; font-family: inherit; font-size: 15px; outline: none; padding-bottom: 3px;
        }
        
        input[type="checkbox"] { transform: scale(1.4); cursor: pointer; accent-color: #0d6efd; }
        
        /* רווח פיזי לשמות */
        .name-spacer { display: inline-block; width: 18px; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; margin-top: 20px; }
            h1 { font-size: 20px; }
            th, td { padding: 8px 5px; font-size: 14px; }
            .control-panel { flex-direction: column; align-items: stretch; }
            .print-button { width: 100%; padding: 12px; }
            .date-picker { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="floating-counter" id="mobile-counter">
        נוכחים: <span id="float-count">0</span> / 21
    </div>

    <div class="container" id="report-container">
        <h1 id="main-title">קבוצת משלחת - דוח נוכחות</h1>
        <h2 id="print-date"></h2>
        
        <div class="control-panel" id="controls">
            <div class="date-picker-container">
                <label for="meetingDate">תאריך המפגש:</label>
                <input type="date" id="meetingDate" class="date-picker">
            </div>
            <button class="print-button" onclick="downloadPDF()">⬇️ שמור כקובץ PDF לדרייב</button>
        </div>

        <table id="attendanceTable">
            <thead>
                <tr>
                    <th style="width: 15%; text-align: center;">נוכח/ת</th>
                    <th style="width: 35%;">שם התלמיד.ה</th>
                    <th style="width: 50%;">הערות</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_1" class="attendance-cb"></td>
                    <td><label for="student_1" style="cursor: pointer; display: block; font-weight: 500;">מיכל<span class="name-spacer"></span>אייזנברג</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_2" class="attendance-cb"></td>
                    <td><label for="student_2" style="cursor: pointer; display: block; font-weight: 500;">רונה<span class="name-spacer"></span>בר יעקב</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_3" class="attendance-cb"></td>
                    <td><label for="student_3" style="cursor: pointer; display: block; font-weight: 500;">שחר<span class="name-spacer"></span>גלייך</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_4" class="attendance-cb"></td>
                    <td><label for="student_4" style="cursor: pointer; display: block; font-weight: 500;">רוני<span class="name-spacer"></span>דריימן</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_5" class="attendance-cb"></td>
                    <td><label for="student_5" style="cursor: pointer; display: block; font-weight: 500;">רותם<span class="name-spacer"></span>הר לב</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_6" class="attendance-cb"></td>
                    <td><label for="student_6" style="cursor: pointer; display: block; font-weight: 500;">ליאל<span class="name-spacer"></span>טדלה</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_7" class="attendance-cb"></td>
                    <td><label for="student_7" style="cursor: pointer; display: block; font-weight: 500;">שי<span class="name-spacer"></span>טבת</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_8" class="attendance-cb"></td>
                    <td><label for="student_8" style="cursor: pointer; display: block; font-weight: 500;">גליה<span class="name-spacer"></span>כהן</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_9" class="attendance-cb"></td>
                    <td><label for="student_9" style="cursor: pointer; display: block; font-weight: 500;">רוני<span class="name-spacer"></span>כלדיאן</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_10" class="attendance-cb"></td>
                    <td><label for="student_10" style="cursor: pointer; display: block; font-weight: 500;">נועה<span class="name-spacer"></span>ליבנה</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_11" class="attendance-cb"></td>
                    <td><label for="student_11" style="cursor: pointer; display: block; font-weight: 500;">אביגיל<span class="name-spacer"></span>מלול</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_12" class="attendance-cb"></td>
                    <td><label for="student_12" style="cursor: pointer; display: block; font-weight: 500;">מעיין<span class="name-spacer"></span>נין נון</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_13" class="attendance-cb"></td>
                    <td><label for="student_13" style="cursor: pointer; display: block; font-weight: 500;">מאי<span class="name-spacer"></span>קסטל</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_14" class="attendance-cb"></td>
                    <td><label for="student_14" style="cursor: pointer; display: block; font-weight: 500;">מרי<span class="name-spacer"></span>קרמובה</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_15" class="attendance-cb"></td>
                    <td><label for="student_15" style="cursor: pointer; display: block; font-weight: 500;">אלונה<span class="name-spacer"></span>רצון</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_16" class="attendance-cb"></td>
                    <td><label for="student_16" style="cursor: pointer; display: block; font-weight: 500;">מרי<span class="name-spacer"></span>שובל</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_17" class="attendance-cb"></td>
                    <td><label for="student_17" style="cursor: pointer; display: block; font-weight: 500;">יפתח<span class="name-spacer"></span>שושן</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_18" class="attendance-cb"></td>
                    <td><label for="student_18" style="cursor: pointer; display: block; font-weight: 500;">עופרי<span class="name-spacer"></span>שטרן</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_19" class="attendance-cb"></td>
                    <td><label for="student_19" style="cursor: pointer; display: block; font-weight: 500;">אדם<span class="name-spacer"></span>שפירא</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_20" class="attendance-cb"></td>
                    <td><label for="student_20" style="cursor: pointer; display: block; font-weight: 500;">תמרה<span class="name-spacer"></span>שרז</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_21" class="attendance-cb"></td>
                    <td><label for="student_21" style="cursor: pointer; display: block; font-weight: 500;">ליה<span class="name-spacer"></span>תומר</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        document.getElementById('meetingDate').valueAsDate = new Date();

        function updateCounter() {
            const checkboxes = document.querySelectorAll('.attendance-cb');
            let count = 0;
            checkboxes.forEach(cb => { if (cb.checked) count++; });
            document.getElementById('float-count').innerText = count;
        }

        const allCheckboxes = document.querySelectorAll('.attendance-cb');
        allCheckboxes.forEach(cb => { cb.addEventListener('change', updateCounter); });

        function downloadPDF() {
            // שמירת ערכי ההערות
            const inputs = document.querySelectorAll('.note-input');
            inputs.forEach(input => { input.setAttribute('value', input.value); });
            
            // הכנת התאריך
            const dateInput = document.getElementById('meetingDate').value;
            const printDateElement = document.getElementById('print-date');
            
            if (dateInput) {
                const parts = dateInput.split('-');
                if(parts.length === 3) {
                    printDateElement.innerText = 'תאריך: ' + parts[2] + '/' + parts[1] + '/' + parts[0];
                } else {
                    printDateElement.innerText = 'תאריך: ' + dateInput;
                }
            } else {
                printDateElement.innerText = 'תאריך: לא צוין';
            }

            // עדכון המסך: הסתרת כפתורים וחשיפת התאריך
            document.getElementById('controls').style.display = 'none';
            document.getElementById('mobile-counter').style.display = 'none';
            printDateElement.style.display = 'block';

            const element = document.getElementById('report-container');
            
            // הוספנו כאן את פקודת ה-pagebreak שמונעת חיתוך שורות ומעבירה לעמוד שני
            const opt = {
                margin:       10,
                filename:     'נוכחות_משלחת_' + dateInput + '.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: ['css', 'legacy'], avoid: 'tr' } // <--- הפתרון לעמודים
            };

            setTimeout(() => {
                html2pdf().set(opt).from(element).save().then(() => {
                    // החזרת המצב לקדמותו אחרי ההורדה
                    document.getElementById('controls').style.display = 'flex';
                    document.getElementById('mobile-counter').style.display = 'block';
                    printDateElement.style.display = 'none';
                });
            }, 150); 
        }
    </script>
</body>
</html>
