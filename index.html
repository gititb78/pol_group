<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קבוצת משלחת | רישום נוכחות</title>
    
    <!-- טעינת הספרייה שמאפשרת הורדה ישירה של PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* ================= עיצוב בהיר ונקי לאפליקציית נוכחות ================= */
        * { box-sizing: border-box; }
        
        body {
            background-color: #f4f6f9; color: #333; 
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px 10px; margin: 0; line-height: 1.6;
        }
        .container {
            max-width: 800px; margin: 0 auto; background-color: #ffffff; 
            padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center; color: #2c3e50; border-bottom: 2px solid #e9ecef; 
            padding-bottom: 15px; margin-top: 0; font-size: 24px;
        }
        .control-panel {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 15px; background-color: #f8f9fa;
            padding: 15px; border-radius: 8px; border: 1px solid #e9ecef;
        }
        .date-picker-container { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .date-picker {
            border: 1px solid #ced4da; padding: 8px 12px; font-family: inherit; 
            font-size: 16px; border-radius: 5px; color: #495057;
        }
        .print-button {
            background-color: #0d6efd; color: #ffffff; border: none; padding: 10px 20px; 
            font-weight: bold; font-size: 15px; border-radius: 5px; cursor: pointer; 
            transition: background-color 0.2s;
        }
        .print-button:hover { background-color: #0b5ed7; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #dee2e6; padding: 12px; text-align: right; }
        th { background-color: #e9ecef; color: #495057; font-weight: bold; }
        tr:nth-child(even) { background-color: #fdfdfd; }
        
        .note-input {
            width: 100%; background: transparent; border: none; border-bottom: 1px dashed #adb5bd;
            color: #333; font-family: inherit; font-size: 15px; outline: none; padding-bottom: 3px;
        }
        
        /* עיצוב הצ'קבוקסים */
        input[type="checkbox"] { transform: scale(1.4); cursor: pointer; accent-color: #0d6efd; }
        
        /* 📱 התאמות לסלולר */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            h1 { font-size: 20px; }
            th, td { padding: 8px 5px; font-size: 14px; }
            .control-panel { flex-direction: column; align-items: stretch; }
            .print-button { width: 100%; padding: 12px; }
            .date-picker { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- מזהה לקונטיינר כדי שהסקריפט יידע מה להפוך ל-PDF -->
    <div class="container" id="report-container">
        <h1>קבוצת משלחת - דוח נוכחות</h1>
        
        <div class="control-panel" id="controls">
            <div class="date-picker-container">
                <label for="meetingDate">תאריך המפגש:</label>
                <input type="date" id="meetingDate" class="date-picker">
            </div>
            <!-- הכפתור מפעיל את פונקציית ההורדה הישירה -->
            <button class="print-button" onclick="downloadPDF()">⬇️ שמור כקובץ PDF</button>
        </div>

        <table id="attendanceTable">
            <thead>
                <tr>
                    <th style="width: 12%; text-align: center;">נוכח/ת</th>
                    <th style="width: 38%;">שם התלמיד.ה</th>
                    <th style="width: 50%;">הערות</th>
                </tr>
            </thead>
            <tbody>
                <!-- תלמיד 1 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_1"></td>
                    <td><label for="student_1" style="cursor: pointer; display: block; font-weight: 500;">מיכל אייזנברג</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 2 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_2"></td>
                    <td><label for="student_2" style="cursor: pointer; display: block; font-weight: 500;">רונה בר יעקב</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 3 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_3"></td>
                    <td><label for="student_3" style="cursor: pointer; display: block; font-weight: 500;">שחר גלייך</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 4 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_4"></td>
                    <td><label for="student_4" style="cursor: pointer; display: block; font-weight: 500;">רוני דריימן</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 5 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_5"></td>
                    <td><label for="student_5" style="cursor: pointer; display: block; font-weight: 500;">רותם הר לב</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 6 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_6"></td>
                    <td><label for="student_6" style="cursor: pointer; display: block; font-weight: 500;">ליאל טדלה</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 7 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_7"></td>
                    <td><label for="student_7" style="cursor: pointer; display: block; font-weight: 500;">שי טבת</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 8 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_8"></td>
                    <td><label for="student_8" style="cursor: pointer; display: block; font-weight: 500;">גליה כהן</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 9 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_9"></td>
                    <td><label for="student_9" style="cursor: pointer; display: block; font-weight: 500;">רוני כלדיאן</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 10 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_10"></td>
                    <td><label for="student_10" style="cursor: pointer; display: block; font-weight: 500;">נועה ליבנה</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 11 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_11"></td>
                    <td><label for="student_11" style="cursor: pointer; display: block; font-weight: 500;">אביגיל מלול</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 12 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_12"></td>
                    <td><label for="student_12" style="cursor: pointer; display: block; font-weight: 500;">מעיין נין נון</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 13 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_13"></td>
                    <td><label for="student_13" style="cursor: pointer; display: block; font-weight: 500;">מאי קסטל</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 14 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_14"></td>
                    <td><label for="student_14" style="cursor: pointer; display: block; font-weight: 500;">מרי קרמובה</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 15 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_15"></td>
                    <td><label for="student_15" style="cursor: pointer; display: block; font-weight: 500;">אלונה רצון</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 16 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_16"></td>
                    <td><label for="student_16" style="cursor: pointer; display: block; font-weight: 500;">מרי שובל</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 17 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_17"></td>
                    <td><label for="student_17" style="cursor: pointer; display: block; font-weight: 500;">יפתח שושן</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 18 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_18"></td>
                    <td><label for="student_18" style="cursor: pointer; display: block; font-weight: 500;">עופרי שטרן</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 19 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_19"></td>
                    <td><label for="student_19" style="cursor: pointer; display: block; font-weight: 500;">אדם שפירא</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 20 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_20"></td>
                    <td><label for="student_20" style="cursor: pointer; display: block; font-weight: 500;">תמרה שרז</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
                <!-- תלמיד 21 -->
                <tr>
                    <td style="text-align: center;"><input type="checkbox" id="student_21"></td>
                    <td><label for="student_21" style="cursor: pointer; display: block; font-weight: 500;">ליה תומר</label></td>
                    <td><input type="text" class="note-input"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // שמים את התאריך של היום בשדה התאריך באופן אוטומטי
        document.getElementById('meetingDate').valueAsDate = new Date();

        // פונקציה לייצוא ה-PDF
        function downloadPDF() {
            // 1. מעדכן את הטקסטים שהקלידו כדי שישמרו ב-PDF
            const inputs = document.querySelectorAll('.note-input');
            inputs.forEach(input => { input.setAttribute('value', input.value); });
            
            // 2. מסתיר את הכפתור ואזור השליטה כדי שלא יופיעו בהדפסה עצמה
            document.getElementById('controls').style.display = 'none';

            // 3. בוחרים את כל האזור שרוצים להדפיס
            const element = document.getElementById('report-container');
            
            // 4. הגדרות ל-PDF
            const dateVal = document.getElementById('meetingDate').value;
            const opt = {
                margin:       10,
                filename:     'נוכחות_משלחת_' + dateVal + '.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // 5. יוצרים ומורידים!
            html2pdf().set(opt).from(element).save().then(() => {
                // מחזירים את אזור הכפתורים למסך ברגע שההורדה מסתיימת
                document.getElementById('controls').style.display = 'flex';
            });
        }
    </script>
</body>
</html>
